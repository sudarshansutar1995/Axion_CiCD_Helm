
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Values.app }}

spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      app: {{ .Values.app }}

  template:
    metadata:
      labels:
        app: {{ .Values.app }}

    spec:
      containers:
        - name: {{ .Values.app }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tags }}"

          ports:
            - containerPort: {{ .Values.ports.containerPort }}

          envFrom:
            - secretRef:
                name: axion-ui-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

