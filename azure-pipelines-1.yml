pool: axion-agent

trigger:
  - none

parameters:

- name: containerRegistry
  displayName: Ingestion_Docker_Build&Push
  type: boolean
  default: false

- name: Kubernate_secrer
  displayName: Kubernate_secrer
  type: boolean
  default: false
 
- name: Namespace_Environment
  displayName: Namespace_Environment
  type: string
  default: dev
  values:
  - dev
  - prod


variables:
- group: Axion-Project_helm


stages:
  - stage: 
    displayName: Ingestion_Docker_Build&Push 
    condition: eq('${{ parameters.containerRegistry }}', 'true')
    jobs:
      - job: 
        displayName: Ingestion_Docker_Build&Push 
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'docker-acr-svc-connection'
            repository: 'axion-ingestion'
            command: 'buildAndPush'
            Dockerfile: '**/axion-ingestion-service/Dockerfile'
            tags: '$(Build.BuildId)-BuildId'
        
      
  
  - stage: 
    displayName: Helm_deploy_to_cluster
    condition: eq('${{ parameters.Kubernate_secrer }}', 'true')
    jobs:
      - job: 
        displayName: Helm_deploy_to_cluster
        steps:
        - task: HelmDeploy@1
          inputs:
            connectionType: 'Azure Resource Manager'
            azureSubscription: 'axion-helm-project'
            azureResourceGroup: 'rg_sudarshan'
            kubernetesCluster: 'kub-sudarshan'
            namespace: '${{ parameters.Namespace_Environment }}'
            command: 'upgrade'
            chartType: 'FilePath'
            chartPath: 'axion-ingestion-service/helm'
            releaseName: 'axion-ingestion'
            valueFile: 'axion-ingestion-service/helm/values-${{ parameters.Namespace_Environment }}.yaml'
            install: true
            waitForExecution: false
            arguments: '--create-namespace'


        

        