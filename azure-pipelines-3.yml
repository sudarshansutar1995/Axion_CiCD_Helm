
pool: axion-agent

trigger:
  - none

parameters:

- name: Docker_Build_and_Push_ACR
  displayName: Docker Build and Push to ACR
  type: boolean
  default: false

- name: Deploy_to_KubernetesCluster
  displayName: Deploy to Kubernetes Cluster
  type: boolean
  default: false

- name: Namespace_Environment
  displayName: Namespace Environment
  type: string
  default: dev
  values:
  - dev
  - prod


variables:
- group: Axion-Project_helm


stages:

# ============================================================
# Stage 1 - Docker Build and Push
# ============================================================

- stage: Docker_Build_and_Push_ACR
  displayName: Docker Build and Push ACR for Axion Telemetry Service

  condition: eq('${{ parameters.Docker_Build_and_Push_ACR }}', 'true')

  jobs:

  - job: Docker_Build_Push_Telemetry
    displayName: Docker Build and Push Axion Telemetry Service

    steps:

    - task: Docker@2
      displayName: Build and Push Telemetry Docker Image
      inputs:
        containerRegistry: 'docker-acr-svc-connection'
        repository: 'axion-telemetary-service'
        command: 'buildAndPush'
        Dockerfile: '**/axion-telemetry-query-service/Dockerfile'
        tags: |
          $(Build.BuildId)-BuildId


# ============================================================
# Stage 2 - Helm Deploy
# ============================================================

- stage: Helm_Deploy_to_Cluster
  displayName: Helm Deploy Axion Telemetry Service to Kubernetes

  condition: eq('${{ parameters.Deploy_to_KubernetesCluster }}', 'true')

  jobs:

  - job: Helm_Deploy_Telemetry_Service
    displayName: Helm Deploy Axion Telemetry Service

    steps:

    - task: HelmDeploy@1
      displayName: Helm Upgrade/Install Axion Telemetry Service
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: 'axion-helm-project'
        azureResourceGroup: 'rg_sudarshan'
        kubernetesCluster: 'kub-sudarshan'
        namespace: '${{ parameters.Namespace_Environment }}'
        command: 'upgrade'
        chartType: 'FilePath'
        chartPath: 'axion-telemetry-query-service/helm'
        releaseName: 'axion-telemetry-query-service'
        valueFile: 'axion-telemetry-query-service/helm/values-${{ parameters.Namespace_Environment }}.yaml'
        install: true
        waitForExecution: false
        arguments: '--create-namespace --set image.tags=$(Build.BuildId)-BuildId'

