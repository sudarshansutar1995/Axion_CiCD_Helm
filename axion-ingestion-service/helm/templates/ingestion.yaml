apiVersion: apps/v1
kind: Deployment
metadata:
  name:  {{.Release.Name}}
  namespace: {{ .Values.namespace }}
  labels:
    app:  {{.Values.app}}
spec:
  selector:
    matchLabels:
      app: {{.Values.app}}
  replicas: {{.Values.replicas}} 
  template:
    metadata:
      labels:
        app:  {{.Values.app}}
    spec:
      containers:
      - name:  {{.Values.app}}
        image: "{{.Values.image.repositary}}:{{.Values.image.tags}}"

        ports:
        - containerPort: {{.Values.ports.containerPort}} 

        resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{.Values.secretKeyRef.name}}
              key: DATABASE_URL