apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Release.Name}}
spec:
  selector:
    matchLabels:
      app: {{.Values.app}}
  template:
    metadata:
      labels:
        app: {{.Values.app}}
    spec:
      containers:
      - name: {{.Values.app}}
        image: "{{.Values.image.repositary}}:{{.Values.image.tags}}" 
        env:
        - name: API_URL 
          valueFrom:
            secretKeyRef:
              name:  {{.Values.secretKeyRef.secret_name}}
              key: API_URL

        - name: INTERVAL_SECONDS
          valueFrom:
            secretKeyRef:
              name: {{.Values.secretKeyRef.secret_name}}
              key: INTERVAL_SECONDS


        ports:
        - containerPort: {{.Values.ports.contPort}}

      
