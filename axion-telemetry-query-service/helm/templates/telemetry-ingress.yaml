apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{.Values.metadata.Ingressname}}
  annotations:
    appgw.ingress.kubernetes.io/health-probe-path: /docs
spec:
  ingressClassName: azure-application-gateway
  rules:
    - host: telemetry.sudsutar.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: telemetry-service-pod
                port:
                  number: {{.Values.ports.containerPort}}
                  